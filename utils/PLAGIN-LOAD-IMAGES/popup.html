<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Load Images</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <section class="popup__card" aria-labelledby="popup-title">
        <h1 id="popup-title" class="popup__title">Image Loader</h1>
        <p class="popup__subtitle">
          Collect and prepare images from the current page in one click.
        </p>
        <div class="popup__actions">
          <button class="popup__btn" type="button">Load images</button>
          <span class="popup__status" aria-live="polite">Ready</span>
        </div>
      </section>
    </main>
  </body>
</html>
